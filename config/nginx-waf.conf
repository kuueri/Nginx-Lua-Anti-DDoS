lua_shared_dict antiddos 70m;
lua_shared_dict antiddos_blocked 70m;
lua_shared_dict ddos_counter 10m;
lua_shared_dict jspuzzle_tracker 70m;
lua_shared_dict waf_strikes 10m;
lua_shared_dict waf_bans 20m;
lua_shared_dict waf_stats 1m;

init_by_lua_file /etc/nginx/lua/waf-local-overrides.lua;
init_worker_by_lua_file /etc/nginx/lua/waf-stats.lua;

# When the realip module has already taken the client address from a trusted proxy's X-Forwarded-For,
# upstream still sees that header, or a CF-Connecting-IP passed through, next to a public $remote_addr, calls it proxy impersonation, and bans every visitor for 24 hours.
# Dropping both consumed headers lets upstream use $remote_addr; proxy_pass then sends $remote_addr on as X-Forwarded-For.
# A request from an untrusted public address keeps its headers, so upstream still bans spoofers.
# One from a private address, such as a SafeLine proxy that realip does not list, loses CF-Connecting-IP, because upstream trusts private proxies, and only Cloudflare sets that header, so behind any other proxy the client chooses it.
# Upstream answers a WAF rule hit with 403 but never bans, so waf-ban.lua counts those 403s per client address in the log phase:
# 5 within 10 minutes (50 for a crawler or AI User-Agent) ban the address for 1 hour, doubled on each later ban of the same address up to 2^9 hours, answered with 403 in the rewrite phase before upstream runs.
# The ban count expires 30 days after the last ban ends, and a 403 that ends while the address is already banned, as in a burst of HTTP/2 streams, does not count again.
# Upstream matches WAF_URI_Request_table against the raw path, while nginx and Tomcat decode %XX before they pick a file, so /xmlrpc%2ephp would run xmlrpc.php.
# The rewrite phase therefore matches the same rules against $uri, the path after nginx decodes it and resolves "..", and answers a hit with 403.
# It also checks query argument names, cookie names and values, and urlencoded, multipart, and JSON bodies with the query string rules, and XML bodies with its own XML rule, as set by WAF_cookie_block, WAF_body_block, and WAF_body_skip in waf-local-overrides.lua.
# Only 403s from the WAF rules count, in the access phase or from those rewrite-phase checks, never DSpace's own (upstream_status set) or a site's earlier "return 403", and private addresses are never banned.
# A "deny" in a site's location runs before the Lua access handler and counts, so a scanner trap such as "location ~ /\.git { deny all; }" still bans.
# A 403 from the content phase after upstream let the request through, such as a directory listing with "autoindex off", never counts.
rewrite_by_lua_file /etc/nginx/lua/waf-ban.lua;
log_by_lua_file /etc/nginx/lua/waf-ban.lua;

# Login brute force: upstream allows 10,000 requests per 500 ms, and a failed login answers 200 or 302, which no ban counts.
# The key uses $uri, which nginx has already decoded, so /wp%2dlogin.php cannot get past it.
# /index.php covers the SLiMS admin login (p=login) and member login (p=member), which PHP picks by a query value that nginx only sees encoded; admin/ and wp-admin/ are left out.
# An empty key is never limited.
# INLISLite (Yii2) logs in at site/login with pretty URLs, or else at backoffice/, keanggotaan/, or opac/index.php?r=site/login, so every POST to those index.php scripts counts, admin forms included.
# /login and /auth/login cover generic Java and PHP apps.
# A login path may end in /..., which a site that routes \.php(/|$) to PHP hands to the same script as PATH_INFO, or in ;..., which Tomcat drops.
# The zone does nothing until a site adds "limit_req zone=waf_login burst=5 nodelay;" to its server block or login location, because this file sits in every http block, and a limit_req here would also reach unrelated servers, such as DSpace's 19123 proxy to 127.0.0.1:8787.
# nginx does not inherit limit_req into a location that has its own, so DSpace's login locations keep their 5r/m zones.
# There is no limit_req_status here, because a server may already set it in http (DSpace sets 429), and without it the answer is nginx's default 503, which the ban ignores.
map "$request_method:$uri" $waf_login_key {
    default "";
    "~^POST:(?:/[^/]+)?/wp-login\.php(?:/|$)" $binary_remote_addr;
    "~^POST:(?:/(?!admin/|wp-admin/)[^/]+)?/index\.php(?:/|$)" $binary_remote_addr;
    "~^POST:(?:/[^/]+)?/password-login(?:[;/]|$)" $binary_remote_addr;
    "~^POST:(?:/[^/]+)?/(?:rest/login|server/api/authn/login)(?:[;/]|$)" $binary_remote_addr;
    "~^POST:(?:/[^/]+){0,2}/site/login(?:[;/]|$)" $binary_remote_addr;
    "~^POST:(?:/[^/]+)?/(?:backoffice|backend|keanggotaan|opac)/index\.php(?:/|$)" $binary_remote_addr;
    "~^POST:(?:/[^/]+)?/(?:auth/)?login(?:[;/]|$)" $binary_remote_addr;
}
limit_req_zone $waf_login_key zone=waf_login:10m rate=10r/m;

# Runs the WAF on every site and path; a location with its own access_by_lua* handler replaces it.
# waf-ban.lua runs upstream's waf.lua in the access phase and marks a request that upstream let through, which is how the log phase tells a later content-phase 403 apart.
access_by_lua_file /etc/nginx/lua/waf-ban.lua;

# WAF stats as JSON, read with: curl -s http://127.0.0.1:9180/ddos_stats
# Loopback only, because the output lists client addresses; 9180 stays clear of DSpace (8080, 8787, 5432, 19123).
# The empty rewrite and access handlers keep waf-ban.lua and the WAF off this request, so it is neither checked, challenged, nor counted in the stats.
server {
    listen 127.0.0.1:9180;

    location = /ddos_stats {
        rewrite_by_lua_block {
            return
        }
        access_by_lua_block {
            return
        }
        default_type application/json;
        content_by_lua_file /etc/nginx/lua/waf-stats.lua;
    }
}
