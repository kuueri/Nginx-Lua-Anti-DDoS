lua_shared_dict antiddos 70m;
lua_shared_dict antiddos_blocked 70m;
lua_shared_dict ddos_counter 10m;
lua_shared_dict jspuzzle_tracker 70m;
lua_shared_dict waf_strikes 10m;

init_by_lua_file /etc/nginx/lua/waf-local-overrides.lua;

# When the realip module has already taken the client address from a trusted proxy's X-Forwarded-For,
# upstream still sees that header next to a public $remote_addr, calls it proxy impersonation, and bans every visitor for 24 hours.
# Dropping the consumed header lets upstream use $remote_addr; proxy_pass then sends $remote_addr on as X-Forwarded-For.
# A request from an untrusted address keeps its header, so upstream still bans spoofers.
# Upstream answers a WAF rule hit with 403 but never bans, so waf-ban.lua counts those 403s per client address in the log phase:
# 5 within 10 minutes ban the address for 1 hour, answered with 403 in the rewrite phase before upstream runs.
# Upstream matches WAF_URI_Request_table against the raw path, while nginx and Tomcat decode %XX before they pick a file, so /xmlrpc%2ephp would run xmlrpc.php.
# The rewrite phase therefore matches the same rules against $uri, the path after nginx decodes it and resolves "..", and answers a hit with 403.
# It also checks query argument names, cookie values, and urlencoded, multipart, and JSON bodies with the query string rules, as set by WAF_cookie_block, WAF_body_block, and WAF_body_skip in waf-local-overrides.lua.
# Only 403s from the WAF rules count, in the access phase or from those rewrite-phase checks, never DSpace's own (upstream_status set) or a site's earlier "return 403", and private addresses are never banned.
rewrite_by_lua_file /etc/nginx/lua/waf-ban.lua;
log_by_lua_file /etc/nginx/lua/waf-ban.lua;

# Runs the WAF on every site and path; a location with its own access_by_lua* handler replaces it.
access_by_lua_file /etc/nginx/lua/waf.lua;

# WAF stats as JSON, read with: curl -s http://127.0.0.1:9180/ddos_stats
# Loopback only, because the output lists client addresses; 9180 stays clear of DSpace (8080, 8787, 5432, 19123).
# The empty access handler keeps the WAF off this request, so it neither gets challenged nor counts in the stats.
server {
    listen 127.0.0.1:9180;

    location = /ddos_stats {
        access_by_lua_block {
            return
        }
        default_type application/json;
        content_by_lua_file /etc/nginx/lua/waf-stats.lua;
    }
}
